services:

  postgis:

    image: postgis/postgis:16-3.5

    container_name: postgis

    restart: always

    environment:

      POSTGRES_USER: gis

      POSTGRES_PASSWORD: 123456

      POSTGRES_DB: gisdb


    ports:

      - "5432:5432"


    volumes:

      - ./postgis-data:/var/lib/postgresql/data